# Publish the annotator to GitHub Pages.
#
# Adapted from nbharathik/ifc-viewx's deploy-pages.yml, with its npm/Vite and
# MkDocs steps dropped: this app has no build step and no dependencies, so
# assembling the site is a copy plus a generated index. Python is here only to
# run `annotator/build_site.py`.
#
# The floor plans are committed under `annotator/data/` (about 1.1 MB) rather
# than extracted here, because extracting them needs the 2 GB IFC corpus and
# IfcOpenShell. Re-run `main/export_plans.py` locally and commit the result when
# the plans change.
#
# Before the first run: Settings > Pages > Source = "GitHub Actions".

name: Deploy annotator to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "annotator/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The browser build and the collection script each compose the building
      # graph, in JavaScript and in Python. If they ever disagree, an annotator
      # signs off on one graph and the dataset receives another -- so the deploy
      # fails rather than shipping that.
      - name: Check compose.js and compose.py agree
        run: python annotator/test_compose_parity.py

      # The exported graph's whole point is that other people's software opens
      # it, so networkx is installed here and made to read both formats back.
      # It also checks the standalone page against a room named to break out of
      # its <script> block -- room names come out of an IFC and can be anything.
      - name: Check the graph export opens elsewhere
        run: |
          pip install networkx
          python annotator/test_export_graph.py

      # Serves the built site from a subdirectory, as a project Pages site is
      # served, and drives store.js under node. Catches the absolute-path and
      # missing-manifest failures, which are invisible until after publishing.
      - name: Check the static build works from a subpath
        run: python annotator/test_static_build.py

      # The third backend. A relative --plans outside annotator/ served 404s for
      # every plan, because send_from_directory resolves a relative directory
      # against the app root and not the working directory. This drives the
      # awkward layout a real corpus has: plans in a subfolder, IFC files in
      # the parent, path given relative.
      - name: Check the local server backend
        run: |
          pip install flask
          python annotator/test_server_mode.py

      # The dataset-folder backend writes into the annotator's own filesystem.
      # A truncated annotation file loses a day's work and leaves no trace, so
      # the write path (including two saves racing) is checked here.
      - name: Check the dataset-folder backend
        run: python annotator/test_dir_mode.py

      # The 3D view is the one part that cannot be exercised without a browser,
      # and it broke on a bare `from "three"` in a CDN module that no other test
      # could see. This checks the pinned modules still resolve in a browser and
      # that the replacement orbit controls behave. It skips, rather than fails,
      # when the CDN is unreachable.
      - name: Check the 3D viewer's dependencies
        run: python annotator/test_viewer_deps.py

      # The one that matters. Every regression this tool shipped -- a name
      # collision in the state object, a block removed by an over-wide edit, a
      # section on the wrong axis, a control that stopped being wired -- was
      # invisible to the suites above and obvious the moment someone loaded the
      # page. This loads it in Chromium and clicks through. It skips if the
      # browser is unavailable rather than blocking the deploy.
      - name: Drive the annotator in a real browser
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
          python annotator/test_e2e.py
        env:
          # The suite drives node's playwright, not the Python package.
          PLAYWRIGHT_DIR: ${{ github.workspace }}/node_modules/playwright

      - name: Build static site
        run: python annotator/build_site.py --out dist

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
